server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin app: nothing external is loaded. 'unsafe-inline' is for styles only (CodeMirror and the
    # UI kit inject <style> tags); scripts must come from this origin. Defined at server level on purpose:
    # add_header in a nested location would silently drop these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Add Strict-Transport-Security at whatever terminates TLS in front of this container.

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A query may run up to the API's statement timeout (30 s by default) before it answers.
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Hashed filenames: safe to cache forever. A missing asset is a 404, not index.html.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths get the shell.
    location / {
        try_files $uri /index.html;
    }
}
